[package]
name = "lonepine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Coverage-guided driver fuzzer for the bedrock hypervisor"

[lib]
name = "lonepine"
path = "src/lib.rs"

[[bin]]
name = "lonepine"
path = "src/main.rs"

[dependencies]
bedrock-assertions = { path = "../bedrock-assertions" }
bedrock-lab = { path = "../bedrock-lab" }
bedrock-vm = { path = "../bedrock-vm" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = "1"
