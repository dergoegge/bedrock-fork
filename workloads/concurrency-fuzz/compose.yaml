# Concurrency-fuzz workload: one container that signals the bedrock VM ready
# and then idles. The fuzzer execs one of the benchmark's singleton drivers
# (/opt/bedrock/drivers/singleton_{queue,lost_update,reclaim_race,deadlock} —
# see ../README.md) into it on each iteration; each driver wraps its target in
# thread-fuzz, opting it into the in-kernel scx-fuzz chaos scheduler (loaded by
# the guest at boot; see guest/scx-fuzz/). The in-guest workload monitor
# watches `podman events` and trips a failed assertion if an exec dies
# non-zero, which the lab reports as a bug (see workloads/README.md — non-zero
# exit == bug); for these targets that's the expected, successful outcome.
#
# The podman initrd (nix/podman-initrd.nix) loads bedrock-io.ko before bringing
# this up, so once the container is running the deterministic I/O channel is
# live and the lab can drive bash at `host` or at the `fuzz` container. No
# container shuts the VM down on its own — the lab owns lifetime.
#
# The image comes from images.tar (built by ./build.sh) — never pulled.

services:
  fuzz:
    image: bedrock/concurrency-fuzz:latest
    pull_policy: never
    container_name: fuzz
    privileged: true  # Required for the VMCALL helper and for setting SCHED_EXT.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /usr/local/bin/bedrock-ready
        echo "concurrency-fuzz: ready signaled, idling"
        sleep infinity
